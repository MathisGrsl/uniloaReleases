name: Linux build

# Builds Uniloa for Linux from the private source repository, tries it on the oldest and the
# newest Ubuntu served, and publishes it under the tag mac-linux, beside the Mac version.
# Run by hand from the Actions tab. Logs are public: the steps print as little as they can.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit of MathisGrsl/uniloa to build
        required: true

permissions:
  contents: write

jobs:
  build:
    # The oldest Linux still served: the terminal's module compiled there also runs on newer ones.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MathisGrsl/uniloa
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.UNILOA_SOURCE_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --loglevel=error > npm.log 2>&1 || (tail -30 npm.log; exit 1)

      - name: Build the installer
        env:
          PM_SERVER_URL: https://uniloa.com
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node desktop/scripts/build.mjs --installer > build.log 2>&1 || (tail -40 build.log; exit 1)
          grep -E "electron-builder|building|target=" build.log | tail -10 || true
          ls -la desktop/release

      - name: Try the Linux app
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq xvfb libnss3 libgtk-3-0 libgbm1 libasound2 fuse3 > /dev/null
          xvfb-run -a node desktop/scripts/smoke-run.mjs smoke-linux-22.png desktop/release/Uniloa.AppImage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-linux-22
          path: smoke-*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          retention-days: 7
          path: |
            desktop/release/Uniloa.AppImage
            desktop/release/latest-linux.yml

  # Where a recent Ubuntu's rules on the sandbox stop an Electron app that does not allow for them.
  newer-linux:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MathisGrsl/uniloa
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.UNILOA_SOURCE_KEY }}
          persist-credentials: false
          sparse-checkout: desktop/scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: installer-linux

      - name: Try the Linux app as a recent Ubuntu runs it
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq xvfb libnss3 libgtk-3-0 libgbm1 libasound2t64 fuse3 > /dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          chmod +x Uniloa.AppImage
          xvfb-run -a node desktop/scripts/smoke-run.mjs smoke-linux-24.png ./Uniloa.AppImage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-linux-24
          path: smoke-*.png
          if-no-files-found: ignore

  publish:
    needs: [build, newer-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer-linux

      # latest-linux.yml goes last: the updater must not read it before the AppImage is there.
      - name: Publish under mac-linux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mac-linux --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload mac-linux Uniloa.AppImage --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload mac-linux latest-linux.yml --repo "$GITHUB_REPOSITORY" --clobber
